<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedutspooky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Dancing+Script:wght@600&display=block">
<style>
:root{--ink:#ffe9ee;--bg:#07030a;--pur:#7b2d8e;--sun:#ffc857}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;font-family:Figtree,system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
html,body,canvas,#s1,#skip{cursor:var(--cur,auto)}
#s1{position:fixed;inset:0;background:#0b0512;display:flex;align-items:center;justify-content:center;z-index:5;overflow:hidden;transition:background .1s}
#s1.lit{background:var(--sun)}
#stage{position:relative;z-index:1;width:min(92vw,900px);min-height:40vh;display:flex;align-items:center;justify-content:center;text-align:center}
.ln{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:.1em .3em;font:800 clamp(26px,8vw,66px)/1.2 Figtree,sans-serif;text-wrap:balance;color:#f3e9ff;text-shadow:0 0 18px rgba(170,110,255,.65)}
.w2{display:inline-block}
.row{position:relative;display:flex;align-items:center;justify-content:center;gap:.3em;padding:.4em .7em;font:800 clamp(30px,10.5vw,92px)/1 Figtree,sans-serif;color:var(--pur);white-space:nowrap;animation:gl 3.2s 1.6s infinite}
.row::before,.row::after{content:"";position:absolute;top:-.05em;bottom:-.05em;width:.06em;background:#fff;border-radius:9px;box-shadow:0 0 10px #fff;transform:scaleY(0);animation:bar .7s .1s forwards}
.row::before{left:0}.row::after{right:0}
@keyframes bar{to{transform:scaleY(1)}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes beat{50%{transform:scale(1.16)}}
.w{display:inline-flex;align-items:center;opacity:0;transform:translateY(.4em);animation:up .6s forwards}
.lv{display:inline-block;overflow:hidden;max-width:4em;transition:max-width .7s,opacity .5s}
.hr{position:relative;display:inline-block;width:0;height:.8em;transition:width .7s}
.hr svg{position:absolute;left:0;top:0;width:.8em;height:.8em;transform:scale(0);transition:transform .5s .2s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 .12em rgba(255,45,74,.8))}
.dot{position:absolute;left:50%;top:50%;width:.12em;height:.12em;margin:-.06em;border-radius:50%;background:var(--pur)}
#s1.h .lv{max-width:0;opacity:0}
#s1.h .hr{width:.9em}
#s1.h .hr svg{transform:scale(1);animation:beat 1s .9s infinite}
.fog{position:absolute;inset:-20%;pointer-events:none;opacity:.22;transition:opacity .3s;background:radial-gradient(40% 30% at 20% 85%,#fff,transparent),radial-gradient(35% 25% at 75% 90%,#fff,transparent),radial-gradient(30% 20% at 50% 100%,#fff,transparent);filter:blur(16px);animation:drift 12s ease-in-out infinite alternate}
#s1.lit .fog{opacity:.55}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%) translateY(-3%)}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(25,0,40,.8) 100%)}
.dark{position:absolute;inset:0;pointer-events:none;background:#12001c;opacity:0;animation:flick 4.5s 1s infinite}
@keyframes flick{0%,7%,13%,58%,63%,100%{opacity:0}8%{opacity:.6}9%{opacity:.05}10%{opacity:.75}11%{opacity:.1}12%{opacity:.5}59%{opacity:.55}60%{opacity:0}61%{opacity:.7}62%{opacity:.1}}
@keyframes gl{0%,90%,100%{transform:none;text-shadow:none}91%{transform:translate(-.03em,.01em);text-shadow:.05em 0 #f0f,-.05em 0 #0ff}93%{transform:translate(.03em,-.01em);text-shadow:-.05em 0 #f0f,.05em 0 #0ff}95%{transform:none;text-shadow:none}}
.bat{position:absolute;margin:0;pointer-events:none;z-index:2}
.eyes{position:absolute;display:flex;gap:.9em;pointer-events:none;font-size:16px}
.eyes i{width:.7em;height:.4em;border-radius:50%;background:#ffd84a;box-shadow:0 0 10px #ffb400}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:9}
#skip{display:none;position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:6;background:rgba(255,255,255,.08);color:#cfd8e6;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:6px 14px;font:600 13px Figtree,sans-serif}
.words{position:fixed;left:0;right:0;bottom:calc(6% + env(safe-area-inset-bottom,0px));text-align:center;padding:0 24px;pointer-events:none;color:var(--ink)}
.to{margin:0;font:600 clamp(34px,10vw,52px) "Dancing Script",cursive;text-shadow:0 0 22px rgba(255,60,100,.55)}
.sub{margin:6px 0 0;font:400 clamp(13px,3.6vw,16px) Figtree,system-ui,sans-serif;color:#c49aa6;letter-spacing:.02em}
.to,.sub{opacity:0}
.credit{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:12px Figtree,system-ui,sans-serif;color:#8a6f78;opacity:0}
.credit a{color:inherit}
.bat svg{display:block;width:100%;height:auto;overflow:visible;animation:bob .24s infinite alternate ease-in-out}
.bat .wg{transform-origin:31px 24px;animation:wf .24s infinite alternate ease-in-out}
.bat .fw{animation-delay:-.06s}
@keyframes wf{from{transform:rotate(22deg)}to{transform:rotate(-62deg)}}
@keyframes bob{from{transform:translateY(7%)}to{transform:translateY(-7%)}}
.sub svg{width:1.15em;height:1.15em;vertical-align:-.2em;margin-left:.35em}
#mu{display:none;position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:6;width:38px;height:38px;padding:0;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#cfd8e6;border:1px solid rgba(255,255,255,.2);border-radius:50%}
#mu svg{width:20px;height:20px}
.nm{color:var(--sun);text-shadow:0 0 20px rgba(255,200,87,.75)}
.hh{display:inline-block;overflow:hidden;max-width:2em;transition:max-width .7s,opacity .5s}
.row>.w:first-child{transition:margin .7s}
#s1.h .hh{max-width:0;opacity:0}
#s1.h .row>.w:first-child{margin-right:-.3em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="s1"><div class="fog"></div><div id="stage"></div><div class="vig"></div><div class="dark"></div></div>
<div class="words"><p class="to" id="to"></p><p class="sub" id="sub"></p></div>
<button id="skip">lewati ›</button>
<button id="mu" aria-label="musik"></button>
<div id="fade"></div>
<script>
const url = new URLSearchParams(location.search);
const CONFIG = {
  name: url.get("name") || "Pedut",
  sub: url.get("sub") || "tap tap mawar nya",
  petal: url.get("petal") || "#ff2f55", tip: url.get("tip") || "#ffb3c4", stem: "#3ddc84",
  particles: 18000, bloom: .62, spin: .35
};
const $ = id => document.getElementById(id);
$("to").textContent = "for " + CONFIG.name; $("sub").textContent = CONFIG.sub;
const CUR = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><defs><radialGradient id="a" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#ffb43a"/><stop offset="1" stop-color="#e8590c"/></radialGradient></defs><ellipse cx="18" cy="21" rx="14" ry="12" fill="url(#a)" stroke="#551f00" stroke-width="1.3"/><path d="M18 9q1-5 5-6" stroke="#2e7d32" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M9 18l3.5-4 3.5 4zM20 18l3.5-4 3.5 4z" fill="#290c00"/><path d="M10 24q8 7 16 0l-2-1.2-2.6 2.4-2.4-2.4-2.4 2.4-2.6-2.4z" fill="#290c00"/></svg>`;
document.documentElement.style.setProperty("--cur", `url("data:image/svg+xml,${encodeURIComponent(CUR)}") 18 18, auto`);

const cv = $("c"), g = cv.getContext("2d");
const layer = document.createElement("canvas"), lg = layer.getContext("2d");
let W, H, D, S, U, fx, fy, jx, jy, pts = [], falling = [], scene = 1, busy = 0, ct = 0;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const PET = hex(CONFIG.petal), TIP = hex(CONFIG.tip), STEM = hex(CONFIG.stem);
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k | 0);
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const rnd = (a, b) => a + Math.random() * (b - a);

const sleep = ms => new Promise(r => setTimeout(r, ms));
const LINES = [["Hola","Pedut"],["Tebak","apa","isinya"],["Jangan","ngintip"],["Tebak",CONFIG.name+","],["Jampi-jampi", "dulu", "ada","Password nya"]];
const HEART = '<svg viewBox="0 0 100 100"><path fill="#ff2d4a" stroke="#ff2d4a" stroke-width="4" stroke-linejoin="round" d="M50 8L61.46 38.23L93.75 39.78L68.54 60.03L77.04 91.21L50 73.5L22.96 91.21L31.46 60.03L6.25 39.78L38.54 38.23Z"/></svg>';
async function intro(){
  const st = $("stage"), s1 = $("s1");
  await sleep(900);
  for (const L of LINES){
    const ln = document.createElement("div"); ln.className = "ln"; st.replaceChildren(ln);
    for (const w of L){
      const s = document.createElement("span"); s.className = "w2"; s.textContent = w; if (w.startsWith(CONFIG.name)) s.classList.add("nm"); ln.append(s);
      s.animate([{ opacity: 0, transform: "translateY(.35em) scale(.9)", filter: "blur(8px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 520, easing: "cubic-bezier(.2,.8,.2,1)" });
      await sleep(260 + w.length*28);
    }
    await sleep(1000);
    await ln.animate([{ opacity: 1 }, { opacity: 0, filter: "blur(6px)" }], { duration: 450, fill: "forwards" }).finished;
  }
  await sleep(300);
  for (const [on, ms] of [[1,70],[0,130],[1,60],[0,220],[1,0]]){ s1.classList.toggle("lit", !!on); await sleep(ms); }
  st.innerHTML = `<div class="row"><span class="w" style="animation-delay:.2s"><span class="hh">H</span></span><span class="w" style="animation-delay:.5s"><span class="lv">OLA</span><span class="hr" id="hr">${HEART}</span></span><span class="w" style="animation-delay:.8s">PEDUT</span></div>`;
  await sleep(2400); s1.classList.add("h"); burst();
  await sleep(3200); go(2);
}
function burst(){
  $("s1").animate([{ filter: "brightness(.2) hue-rotate(-20deg)" }, { filter: "none" }], { duration: 600 });
  for (let i = 0; i < 8; i++){
    const d = document.createElement("i"), a = Math.random() * 6.28, r = rnd(50, 110);
    d.className = "dot"; $("hr").appendChild(d);
    d.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`, opacity: 0 }], { duration: 1200, easing: "ease-out", fill: "forwards", delay: 500 });
  }
}
const batT = setInterval(bat, 1400), eyT = setInterval(eyes, 2300);
const BAT = '<svg viewBox="0 -2 60 52"><g stroke="#9a6bd6" stroke-width=".7" stroke-linejoin="round"><g transform="translate(4 -1)"><path class="wg fw" fill="#26143f" d="M31 24Q22 15 14 10L4 8Q7 14 3 19Q9 21 10 28Q16 24 21 30Q25 26 28 28Z"/></g><path fill="#33195a" d="M24 32Q14 36 11 42Q19 40 26 36Z"/><path fill="#3b2166" d="M29 35L27.5 41L31.5 38Z"/><path fill="#3b2166" d="M34 35L34.5 41L37 37Z"/><ellipse cx="32" cy="29" rx="9.5" ry="7" fill="#3b2166"/><ellipse cx="33.5" cy="31" rx="5.5" ry="3.8" fill="#5b3a93" stroke="none"/><path fill="#3b2166" d="M39 21L39.5 10.5L45 19Z"/><path fill="#3b2166" d="M44 19L49.5 10.5L49 22Z"/><path fill="#e58fb4" stroke="none" d="M40.7 18.6L40.9 13.4L43.6 18.2Z"/><path fill="#e58fb4" stroke="none" d="M45.3 18.4L47.8 14L47.6 20.4Z"/><circle cx="43" cy="25" r="6" fill="#3b2166"/><path fill="#3b2166" d="M47 23.8Q53.5 24.2 52.8 27.8Q50 30.4 46.5 29Z"/><circle cx="52" cy="25.6" r="1.1" fill="#e58fb4" stroke="none"/><path fill="#fff" stroke="none" d="M48.6 29.2L49.4 31.4L50.4 29Z"/><g transform="translate(0 0)"><path class="wg" fill="#4d2a80" d="M31 24Q22 15 14 10L4 8Q7 14 3 19Q9 21 10 28Q16 24 21 30Q25 26 28 28Z"/><path class="wg" fill="none" stroke="#a77be0" stroke-width=".7" stroke-linecap="round" d="M31 24Q22 15 14 10M14 10L3 19M14 10L10 28M14 10L21 30"/></g></g><circle cx="45.3" cy="23.6" r="1.9" fill="#ffd84a" stroke="none"/><circle cx="45.8" cy="23.6" r=".8" fill="#1a0b2e" stroke="none"/></svg>';
function bat(){
  if (scene !== 1) return clearInterval(batT);
  const b = document.createElement("b"), dir = Math.random() < .5 ? 1 : -1, L = innerWidth + 60, x0 = dir > 0 ? -60 : L, x1 = dir > 0 ? L : -60;
  b.innerHTML = BAT; b.className = "bat"; b.style.cssText = `width:${rnd(30, 58)}px;top:${rnd(5, 65)}vh;left:0`; $("s1").appendChild(b);
  b.animate([{ transform: `translate(${x0}px,0) scaleX(${dir})` }, { transform: `translate(${(x0 + x1)/2}px,${rnd(-70, 70)}px) scaleX(${dir})` }, { transform: `translate(${x1}px,${rnd(-40, 40)}px) scaleX(${dir})` }], { duration: rnd(2500, 4000), easing: "ease-in-out" }).onfinish = () => b.remove();
}
function eyes(){
  if (scene !== 1) return clearInterval(eyT);
  if ($("s1").classList.contains("lit")) return;
  const e = document.createElement("div"); e.className = "eyes"; e.style.cssText = `left:${rnd(8, 88)}vw;top:${rnd(10, 85)}vh`; e.innerHTML = "<i></i><i></i>"; $("s1").append(e);
  e.animate([{ opacity: 0, transform: "scaleY(.1)" }, { opacity: 1, transform: "scaleY(1)", offset: .2 }, { opacity: 1, transform: "scaleY(1)", offset: .6 }, { opacity: 1, transform: "scaleY(.1)", offset: .68 }, { opacity: 1, transform: "scaleY(1)", offset: .75 }, { opacity: 0, transform: "scaleY(.1)" }], { duration: 2600 }).onfinish = () => e.remove();
}
function go(n){
  if (busy) return; busy = 1; $("fade").style.opacity = 1;
  setTimeout(() => {
    scene = n;
    if (n === 2){ $("s1").style.display = "none"; campT0 = 0; }
    else { $("skip").style.display = "none"; roseT0 = 0; playBgm(); }
    $("fade").style.opacity = 0; busy = 0;
  }, 800);
}
const SONG = "lagu.mp3", VOL = .7;
const bgm = new Audio(SONG); bgm.loop = true; bgm.volume = 0; bgm.preload = "auto";
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/>', MUTE = SPK + '<path d="M17 9l4 6M21 9l-4 6"/></svg>', ON = SPK + '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
let fadeT = 0;
function playBgm(){
  $("mu").style.display = "flex"; $("mu").innerHTML = bgm.muted ? MUTE : ON;
  bgm.play().then(() => { clearInterval(fadeT); fadeT = setInterval(() => { bgm.volume = Math.min(VOL, bgm.volume + .03); if (bgm.volume >= VOL) clearInterval(fadeT); }, 100); })
    .catch(() => addEventListener("pointerdown", playBgm, { once: true }));
}
$("mu").onclick = () => { bgm.muted = !bgm.muted; $("mu").innerHTML = bgm.muted ? MUTE : ON; };
$("skip").onclick = () => { done = 1; go(3); };
intro();

let heat = 1, wnd = 0, feed = 0, mpx = -1e3, mpy = -1e3, shoot = null, nextShoot = 6;
let campT0 = 0, smoke = [], fireP = [], emb = [], ghosts = [], caught = 0, jg = [], cork = 0, done = 0;
const GOAL = 5;
let pops = [], flash = 0;
const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * .6, s: Math.random() }));
const trees = Array.from({ length: 22 }, () => ({ x: Math.random(), h: rnd(.1, .3), k: Math.random() })).sort((a, b) => a.h - b.h);
const flies = Array.from({ length: 14 }, () => ({ x: Math.random(), y: rnd(.45, .75), p: Math.random() * 6, v: rnd(.5, 1.2) }));
function spawn(){ ghosts.push({ bx: rnd(.12, .88), by: rnd(.14, .5), p: Math.random() * 6, v: rnd(.5, .9), f: Math.random() * 3 | 0, st: 0, t: 0, a: 0 }); }
const spr = [[255,235,150],[255,140,40],[200,50,15]].map(c => { const s = document.createElement("canvas"); s.width = s.height = 64; const x = s.getContext("2d"), r = x.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0, `rgba(${c},.9)`); r.addColorStop(.4, `rgba(${c},.35)`); r.addColorStop(1, `rgba(${c},0)`); x.fillStyle = r; x.fillRect(0,0,64,64); return s; });
const grass = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), h: rnd(.5, 1.3), p: Math.random()*6 }));
const gp = o => [o.bx * W + Math.sin(ct * o.v + o.p) * U * 1.5, o.by * H + Math.cos(ct * o.v * .8 + o.p) * U];

function ghost(x, y, r, f, a){
  g.save(); g.translate(x, y); g.globalAlpha = a;
  const gl = g.createRadialGradient(0, 0, 0, 0, 0, r * 2.2);
  gl.addColorStop(0, "rgba(120,255,240,.35)"); gl.addColorStop(1, "rgba(120,255,240,0)");
  g.fillStyle = gl; g.fillRect(-r*2.2, -r*2.2, r*4.4, r*4.4);
  g.fillStyle = "#e6fffb"; g.beginPath(); g.moveTo(-r, r*.9); g.lineTo(-r, -r*.2);
  g.bezierCurveTo(-r, -r*1.3, r, -r*1.3, r, -r*.2); g.lineTo(r, r*.9);
  for (let i = 0; i < 3; i++){ const x1 = r - 2*r/3*i; g.quadraticCurveTo(x1 - r/3, r*1.4, x1 - 2*r/3, r*.9); }
  g.fill(); g.fillStyle = "#1b2a3a";
  g.beginPath(); g.arc(-r*.35, -r*.15, r*.13, 0, 6.3); g.arc(r*.35, -r*.15, r*.13, 0, 6.3); g.fill();
  g.strokeStyle = "#1b2a3a"; g.lineWidth = Math.max(1, r*.08); g.beginPath();
  if (f === 0) g.ellipse(0, r*.3, r*.1, r*.14, 0, 0, 6.3);
  else if (f === 1) g.arc(0, r*.5, r*.2, 3.5, 5.9);
  else g.arc(0, r*.15, r*.22, .3, 2.8);
  g.stroke(); g.restore();
}
let bgc, grainP, fogS, forest = [];
const leaves = Array.from({ length: 12 }, () => ({ xr: Math.random(), yr: rnd(.15, .7), s: rnd(.6, 1.2), p: Math.random()*6, dx: 0 }));
const rn = n => { let s = n; return () => (s = s*16807 % 2147483647) / 2147483647; };
function ridge(c, y0, amp, col, seed){
  const r = rn(seed), ph = [r()*6, r()*6, r()*6]; c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W; x += 6){ const k = x/W; c.lineTo(x, y0 - amp*(.5 + .3*Math.sin(k*5 + ph[0]) + .18*Math.sin(k*13 + ph[1]) + .08*Math.sin(k*31 + ph[2]))); }
  c.lineTo(W, H); c.fill();
}
function pine(c, x, base, h, col, r){
  const n = 6 + (r()*3 | 0), w = h*(.17 + r()*.05), tip = i => [base - h + h*i/n*.96, w*i/n*(.8 + r()*.4)];
  c.fillStyle = col; c.beginPath(); c.moveTo(x, base - h);
  for (let i = 1; i <= n; i++){ const [y, ww] = tip(i); c.lineTo(x + ww, y); c.lineTo(x + ww*.55, y - h*.015); }
  c.lineTo(x + w*.07, base); c.lineTo(x - w*.07, base);
  for (let i = n; i >= 1; i--){ const [y, ww] = tip(i); c.lineTo(x - ww*.55, y - h*.015); c.lineTo(x - ww, y); }
  c.closePath(); c.fill();
}
function buildBG(){
  bgc = document.createElement("canvas"); bgc.width = W*D; bgc.height = H*D;
  const c = bgc.getContext("2d"); c.scale(D, D);
  const sky = c.createLinearGradient(0, 0, 0, fy);
  [[0,"#03040d"],[.55,"#0c1130"],[.85,"#2a1f3d"],[1,"#4a2c3a"]].forEach(a => sky.addColorStop(a[0], a[1]));
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 16; i++){ const x = W*.2 + i*W*.04, y = H*.3 - i*H*.012, m = c.createRadialGradient(x, y, 0, x, y, U*4); m.addColorStop(0, "rgba(150,160,230,.07)"); m.addColorStop(1, "rgba(150,160,230,0)"); c.fillStyle = m; c.fillRect(x - U*4, y - U*4, U*8, U*8); }
  for (const s of stars){ c.fillStyle = `rgba(255,255,255,${.3 + s.s*.6})`; c.fillRect(s.x*W, s.y*H*.66, .6 + s.s*1.6, .6 + s.s*1.6); }

cv.addEventListener("pointerleave", () => { mpx = mpy = -1e3; });
addEventListener("pointerup", () => feed = 0); addEventListener("pointercancel", () => feed = 0);
function flare(){ heat = Math.min(2.6, heat + .9); for (let i = 0; i < 26; i++) emb.push({ x: fx + rnd(-.6, .6)*U, y: fy - U*.8, vx: rnd(-1.6, 1.6)*U, vy: -rnd(2, 6)*U, l: 0, m: rnd(1.2, 2.6), spark: 1 }); }
function drawPetal(f){
  g.save(); g.translate(f.x, f.y); g.rotate(f.rot); g.scale(1, .55 + .45*Math.sin(f.sw*2));
  const gr = g.createRadialGradient(0, -f.r*.3, 0, 0, 0, f.r);
  gr.addColorStop(0, `rgba(${TIP.join(",")},.95)`); gr.addColorStop(1, `rgba(${f.c.join(",")},.85)`);
  g.fillStyle = gr; g.beginPath();
  g.moveTo(0, f.r); g.bezierCurveTo(f.r*1.1, f.r*.2, f.r*.7, -f.r, 0, -f.r*.6);
  g.bezierCurveTo(-f.r*.7, -f.r, -f.r*1.1, f.r*.2, 0, f.r); g.fill();
  g.restore();
}

let roseT0 = 0, lastDrop = 0;
function rose(now, dt){
  if (!roseT0) roseT0 = now;
  const t = (now - roseT0) / 1000;
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  const bg = g.createRadialGradient(W/2, H*.4, 0, W/2, H*.4, H*.7);
  bg.addColorStop(0, "#1c0612"); bg.addColorStop(1, "#07030a");
  g.fillStyle = bg; g.fillRect(0, 0, W, H); spookyBack(t); roseAura(t); drawShoots(t, dt);

  const bloom = ease(clamp((t - 2.2) / 4.5)) * CONFIG.bloom;
  const yaw = t * CONFIG.spin, cy = Math.cos(yaw), sy = Math.sin(yaw);
  const pitch = .62, cp = Math.cos(pitch), sp = Math.sin(pitch);
  const ox = W/2, oy = H*.38, cam = 2.6;
  lg.globalCompositeOperation = "source-over"; lg.clearRect(0, 0, W, H);
  lg.globalCompositeOperation = "lighter";
  for (const p of pts){
    let x, y, z;
    if (p.kind === 0) [x, y, z] = petalPoint(p.P, p.u, p.v, bloom); else { x = p.x; y = p.y; z = p.z; }
    const k = ease(clamp((t - .2 - p.d) / 2.2));
    x = p.sx + (x - p.sx)*k; y = p.sy + (y - p.sy)*k; z = p.sz + (z - p.sz)*k;
    const x1 = x*cy - z*sy, z1 = x*sy + z*cy;
    const y2 = y*cp - z1*sp, z2 = y*sp + z1*cp;
    const f = cam / (cam + z2);
    const px = ox + x1*S*f, py = oy + y2*S*f;
    const shade = .45 + .55*clamp(.6 - z2*1.2), tw = .75 + .25*Math.sin(t*3 + p.s*20);
    lg.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${.5*shade*tw*(p.a || 1)})`;
    const s = (1 + p.s*.9) * f;
    lg.fillRect(px, py, s, s);
  }
  g.globalCompositeOperation = "lighter"; g.setTransform(1, 0, 0, 1, 0, 0);
  g.filter = `blur(${6*D}px)`; g.drawImage(layer, 0, 0); g.filter = "none"; g.drawImage(layer, 0, 0);
  g.setTransform(D, 0, 0, D, 0, 0); g.globalCompositeOperation = "source-over";

  roseMotes(t, ox, oy);
  if (t > 6.5 && now - lastDrop > 650){ dropPetal(ox + (Math.random()-.5)*S*.5, oy - S*.1, false); lastDrop = now; }
  falling = falling.filter(f => {
    if (f.fl){ f.vy = f.vx = f.vr = 0; f.sw = 3.14; } else f.vy += 60*dt; f.vy = Math.min(f.vy, 70); f.vx *= .985; f.sw += dt*2;
    f.x += (f.vx + Math.sin(f.sw)*28)*dt; f.y += f.vy*dt; f.rot += f.vr*dt;
    drawPetal(f);
    if (!f.fl && f.y > RG().yb - 4){ f.fl = 1; f.y = RG().yb - 4 + rnd(-3, 3); } return f.y < H + 30;
  });
  spookyFront(t, dt); $("to").style.opacity = clamp((t - 6) / 1.2) * (1 - rfk*.8);
  subCycle(t);
}

let last = 0;
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000 || .016); last = now;
  if (scene === 2) camp(now, dt); else if (scene === 3) rose(now, dt);
  requestAnimationFrame(loop);
}
addEventListener("resize", resize);
resize(); build();
document.fonts.load('40px "Dancing Script"').finally(() => requestAnimationFrame(loop));
</script>
